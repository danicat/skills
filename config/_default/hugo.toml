# -- Site Configuration --
# https://skills.danicat.dev (Hugo + Blowfish)

theme = "blowfish"
baseURL = "https://skills.danicat.dev/"
defaultContentLanguage = "en"

enableRobotsTXT = true
disablePathToLower = true
summaryLength = 0

buildDrafts = false
buildFuture = false

enableEmoji = true

googleAnalytics = "G-8RHDQGEGZ2"

disableKinds = ["taxonomy", "term", "RSS"]
ignoreLogs = ["warning-goldmark-raw-html"]
includeFiles = ["\\.well-known/**"]

[params]
  images = ["img/og-card.png"]

[services]
  [services.googleAnalytics]
    id = "G-8RHDQGEGZ2"

[pagination]
  pagerSize = 100

[imaging]
  resampleFilter = "lanczos"
  quality = 90
  anchor = "Center"

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.8

[mediaTypes]
  [mediaTypes."application/vnd.catalog+json"]
    suffixes = ["json"]
  [mediaTypes."text/vnd.llms+plain"]
    suffixes = ["txt"]
  [mediaTypes."text/vnd.llmsfull+plain"]
    suffixes = ["txt"]

[outputFormats]
  [outputFormats.CompanionHTML]
    mediaType = "text/html"
    isHTML = true
    ugly = true
    permalinkable = true
  [outputFormats.CatalogJSON]
    mediaType = "application/vnd.catalog+json"
    baseName = "catalog"
    isPlainText = true
    notAlternative = true
  [outputFormats.LLMsTxt]
    mediaType = "text/vnd.llms+plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true
  [outputFormats.LLMsFullTxt]
    mediaType = "text/vnd.llmsfull+plain"
    baseName = "llms-full"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML"]
  page = ["HTML"]

[caches]
  [caches.images]
    dir = ":cacheDir/images"

[minify]
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepQuotes = true
      keepWhitespace = false
