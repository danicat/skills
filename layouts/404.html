{{ define "main" }}
<div class="danicat-card max-w-xl mx-auto my-12 p-8 text-center">
  <img src="/assets/chibi_dani_oops.png" alt="Oops! Skill Not Found" class="mx-auto mb-6 max-w-[200px] h-auto nozoom" width="200" height="200">
  <div class="font-mono text-5xl font-extrabold text-primary-600 dark:text-primary-400 mb-2">404</div>
  <h1 class="text-2xl font-bold text-neutral-900 dark:text-neutral mb-3">Page Not Found</h1>
  <p class="text-sm sm:text-base text-neutral-600 dark:text-neutral-400 leading-relaxed mb-6">
    The requested page or skill could not be found. It may have been moved, renamed, or retired from the catalog.
  </p>
  <div class="flex flex-wrap justify-center gap-3">
    <a href="/" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg bg-primary-600 hover:bg-primary-700 text-white text-sm font-semibold no-underline transition-colors">
      ← Back to Skills Catalog
    </a>
    <a href="https://danicat.dev" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg border border-neutral-300 dark:border-neutral-700 text-neutral-800 dark:text-neutral-200 hover:border-primary-500 text-sm font-semibold no-underline transition-colors">
      danicat.dev Home
    </a>
  </div>
</div>
{{ end }}
