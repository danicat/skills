{{- $t := index site.Data.translations .Site.Language.Lang | default site.Data.translations.en -}}
<script>
  var compactNumFormatter = (typeof Intl !== 'undefined' && Intl.NumberFormat)
    ? new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 1 })
    : null;

  function formatCompactNum(num) {
    if (!num) return '0';
    if (compactNumFormatter) return compactNumFormatter.format(num);
    if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
    return String(num);
  }

  function copyRawPayload(payloadId, btn, defaultLabel) {
    var payloadEl = document.getElementById(payloadId);
    if (!payloadEl) return;
    try {
      var md = JSON.parse(payloadEl.textContent);
      navigator.clipboard.writeText(md).then(function() {
        var labelEl = btn.querySelector('.copy-md-label') || btn;
        labelEl.textContent = '✓ Copied!';
        setTimeout(function() {
          labelEl.textContent = defaultLabel || 'Copy as Markdown';
        }, 1800);
      });
    } catch (e) {
      console.error('Failed to copy markdown payload:', e);
    }
  }

  var STORAGE_STARS_KEY = 'danicat_starred_skills_v1';
  var STORAGE_VIEWS_KEY = 'danicat_viewed_skills_v1';
  var STORAGE_COPIED_SESSION_KEY = 'danicat_session_copied_v1';
  var STORAGE_METRICS_CACHE_KEY = 'danicat_metrics_cache_v1';

  function getMetricsCache() {
    try {
      var raw = localStorage.getItem(STORAGE_METRICS_CACHE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function saveMetricsCache(map) {
    try {
      localStorage.setItem(STORAGE_METRICS_CACHE_KEY, JSON.stringify(map));
    } catch (e) {}
  }

  function getStarredSkills() {
    try {
      return new Set(JSON.parse(localStorage.getItem(STORAGE_STARS_KEY) || '[]'));
    } catch (e) {
      return new Set();
    }
  }

  function saveStarredSkills(set) {
    try {
      localStorage.setItem(STORAGE_STARS_KEY, JSON.stringify(Array.from(set)));
    } catch (e) {}
  }

  function hasCopiedThisSession(docId) {
    try {
      var list = JSON.parse(sessionStorage.getItem(STORAGE_COPIED_SESSION_KEY) || '[]');
      return list.indexOf(docId) !== -1;
    } catch (e) {
      return false;
    }
  }

  function recordCopyThisSession(docId) {
    try {
      var list = JSON.parse(sessionStorage.getItem(STORAGE_COPIED_SESSION_KEY) || '[]');
      if (list.indexOf(docId) === -1) {
        list.push(docId);
        sessionStorage.setItem(STORAGE_COPIED_SESSION_KEY, JSON.stringify(list));
      }
    } catch (e) {}
  }

  function calculateScore(stars, views, featured) {
    var s = Math.max(0, parseInt(stars, 10) || 0);
    var v = Math.max(0, parseInt(views, 10) || 0);
    var base = (100 * s) + v;
    return featured ? (base * 2) : base;
  }

  function handleStarToggle(btn, category, skillId) {
    var starred = getStarredSkills();
    var isStarred = starred.has(skillId);

    if (isStarred) {
      starred.delete(skillId);
    } else {
      starred.add(skillId);
    }
    saveStarredSkills(starred);

    var cachedMetrics = getMetricsCache() || {};
    var elements = document.querySelectorAll('[data-skill-id="' + skillId + '"], #detailStarBtn');
    elements.forEach(function(el) {
      var starButton = el.classList.contains('star-btn') ? el : el.querySelector('.star-btn');
      var starCountEl = el.querySelector ? el.querySelector('.star-count') : document.getElementById('detailStarCount');
      if (starButton) {
        if (!isStarred) {
          starButton.classList.add('is-starred');
          starButton.setAttribute('aria-pressed', 'true');
        } else {
          starButton.classList.remove('is-starred');
          starButton.setAttribute('aria-pressed', 'false');
        }
      }
      var card = el.classList.contains('skill-card') ? el : null;
      if (card) {
        var prevStars = Math.max(0, parseInt(card.getAttribute('data-stars') || '0', 10));
        var currentStars = !isStarred ? Math.max(1, prevStars + 1) : Math.max(0, prevStars - 1);
        var currentViews = Math.max(0, parseInt(card.getAttribute('data-views') || '0', 10));
        var currentCopies = Math.max(0, parseInt(card.getAttribute('data-copies') || '0', 10));
        var isFeatured = card.getAttribute('data-featured') === 'true';
        card.setAttribute('data-stars', currentStars);
        if (starCountEl) starCountEl.textContent = formatCompactNum(currentStars);
        card.setAttribute('data-score', calculateScore(currentStars, currentViews, isFeatured));
        cachedMetrics[skillId] = {
          likes: currentStars,
          views: currentViews,
          copies: currentCopies,
          featured: isFeatured
        };
      }
    });
    saveMetricsCache(cachedMetrics);

    var sortSelect = document.getElementById('sortSelect');
    if (!sortSelect || sortSelect.value === 'popularity') {
      sortSkillsGrid('popularity');
    }

    var detailCount = document.getElementById('detailStarCount');
    if (detailCount) {
      var prevDetail = Math.max(0, parseInt(detailCount.textContent || '0', 10) || 0);
      var cur = !isStarred ? Math.max(1, prevDetail + 1) : Math.max(0, prevDetail - 1);
      detailCount.textContent = formatCompactNum(cur);
    }

    if (window.DanicatFirestore) {
      window.DanicatFirestore.toggleStar(category, skillId, !isStarred).catch(function(err) {
        console.error('Firestore star update failed:', err);
      });
    }

    if (typeof gtag === 'function') {
      gtag('event', 'like_skill', {
        skill_category: category,
        skill_name: skillId,
        action: !isStarred ? 'like' : 'unlike',
        page_location: window.location.href
      });
    }
  }

  function handleCardCopy(btn, category, skillId) {
    var cmdBox = btn.closest('.cmd-box');
    var cmdText = cmdBox ? cmdBox.querySelector('.cmd-text').innerText : '';
    if (!cmdText) return;

    var docId = category + '-' + skillId;
    var alreadyCopiedThisSession = hasCopiedThisSession(docId);

    navigator.clipboard.writeText(cmdText).then(function() {
      var origHtml = btn.innerHTML;
      btn.innerHTML = '<span>✓</span> {{ $t.ui.copiedBtn }}';
      btn.classList.add('copied');

      if (!alreadyCopiedThisSession) {
        recordCopyThisSession(docId);

        var card = btn.closest('.skill-card');
        if (card) {
          var currentCopies = Math.max(0, parseInt(card.getAttribute('data-copies') || '0', 10)) + 1;
          card.setAttribute('data-copies', currentCopies);
          var currentStars = Math.max(0, parseInt(card.getAttribute('data-stars') || '0', 10));
          var currentViews = Math.max(0, parseInt(card.getAttribute('data-views') || '0', 10));
          var isFeatured = card.getAttribute('data-featured') === 'true';
          card.setAttribute('data-score', calculateScore(currentStars, currentViews, isFeatured));
        }

        if (window.DanicatFirestore) {
          window.DanicatFirestore.incrementMetric(category, skillId, 'copies', 1).catch(function(err) {
            console.error('Firestore copy increment failed:', err);
          });
        }

        if (typeof gtag === 'function') {
          gtag('event', 'copy_install_command', {
            skill_category: category,
            skill_name: skillId,
            command_text: cmdText,
            page_location: window.location.href
          });
        }
      }

      setTimeout(function() {
        btn.innerHTML = origHtml;
        btn.classList.remove('copied');
      }, 1800);
    });
  }

  function copyInstall(cmd, btn) {
    var card = btn.closest('.skill-card');
    var category = card ? card.getAttribute('data-category') : '';
    var skillId = card ? card.getAttribute('data-skill-id') : '';
    handleCardCopy(btn, category, skillId);
  }

  function copyCommand(cmd, btn) {
    navigator.clipboard.writeText(cmd).then(function() {
      var orig = btn.innerHTML;
      btn.innerHTML = '<span>✓</span> {{ $t.ui.copiedBtn }}';
      btn.classList.add('copied');
      setTimeout(function() {
        btn.innerHTML = orig;
        btn.classList.remove('copied');
      }, 1500);
    });
  }

  function switchInstallTab(btn, targetId) {
    var container = btn.closest('.tab-container') || btn.closest('.install-widget');
    if (!container) return;
    container.querySelectorAll('.install-tab-btn').forEach(function(b) { b.classList.remove('active'); });
    container.querySelectorAll('.install-panel').forEach(function(c) { c.classList.remove('active'); });
    btn.classList.add('active');
    var target = container.querySelector('#' + targetId);
    if (target) target.classList.add('active');
  }

  function setGlobalCliMode(mode, btn) {
    document.querySelectorAll('.mode-pill').forEach(function(b) { b.classList.remove('active'); });
    if (btn) btn.classList.add('active');
    localStorage.setItem('preferred_cli_mode', mode);
    document.querySelectorAll('.cmd-box').forEach(function(box) {
      var textSpan = box.querySelector('.cmd-text');
      if (!textSpan) return;
      if (mode === 'npx') {
        textSpan.innerText = box.getAttribute('data-npx');
      } else {
        textSpan.innerText = box.getAttribute('data-kungfu');
      }
    });
  }

  function sortSkillsGrid(mode) {
    var gridEl = document.getElementById('skillsGrid');
    if (!gridEl) return;
    var cardNodes = Array.from(gridEl.querySelectorAll('.skill-card'));
    if (cardNodes.length === 0) return;

    var sorted = cardNodes.slice().sort(function(a, b) {
      if (mode === 'popularity') {
        var scoreA = parseFloat(a.getAttribute('data-score') || '0');
        var scoreB = parseFloat(b.getAttribute('data-score') || '0');
        if (scoreB !== scoreA) return scoreB - scoreA;
        var featA = a.getAttribute('data-featured') === 'true' ? 1 : 0;
        var featB = b.getAttribute('data-featured') === 'true' ? 1 : 0;
        if (featB !== featA) return featB - featA;
        var starsA = Math.max(0, parseInt(a.getAttribute('data-stars') || '0', 10));
        var starsB = Math.max(0, parseInt(b.getAttribute('data-stars') || '0', 10));
        if (starsB !== starsA) return starsB - starsA;
        var viewsA = Math.max(0, parseInt(a.getAttribute('data-views') || '0', 10));
        var viewsB = Math.max(0, parseInt(b.getAttribute('data-views') || '0', 10));
        if (viewsB !== viewsA) return viewsB - viewsA;
      } else if (mode === 'category') {
        var catA = a.getAttribute('data-category') || '';
        var catB = b.getAttribute('data-category') || '';
        if (catA !== catB) return catA < catB ? -1 : 1;
      }
      var nameA = a.getAttribute('data-name') || '';
      var nameB = b.getAttribute('data-name') || '';
      if (nameA !== nameB) return nameA < nameB ? -1 : 1;
      return 0;
    });

    var orderChanged = false;
    for (var i = 0; i < sorted.length; i++) {
      if (sorted[i] !== cardNodes[i]) {
        orderChanged = true;
        break;
      }
    }
    if (orderChanged) {
      sorted.forEach(function(card) { gridEl.appendChild(card); });
    }
  }

  function hydrateCardsFromLocal() {
    var starred = getStarredSkills();
    var cachedMetrics = getMetricsCache();
    var gridEl = document.getElementById('skillsGrid');
    if (!gridEl) return false;
    var hasLocalChanges = false;
    gridEl.querySelectorAll('.skill-card').forEach(function(card) {
      var skillId = card.getAttribute('data-skill-id');
      var origScore = parseFloat(card.getAttribute('data-score') || '0');
      var curStars = Math.max(0, parseInt(card.getAttribute('data-stars') || '0', 10));
      var curViews = Math.max(0, parseInt(card.getAttribute('data-views') || '0', 10));
      var curCopies = Math.max(0, parseInt(card.getAttribute('data-copies') || '0', 10));
      var isFeatured = card.getAttribute('data-featured') === 'true';

      if (cachedMetrics && cachedMetrics[skillId]) {
        var cm = cachedMetrics[skillId];
        if (typeof cm.likes === 'number') curStars = Math.max(0, cm.likes);
        if (typeof cm.views === 'number') curViews = Math.max(curViews, cm.views);
        if (typeof cm.copies === 'number') curCopies = Math.max(curCopies, cm.copies);
        if (typeof cm.featured === 'boolean') isFeatured = cm.featured;
      }

      if (starred.has(skillId)) {
        var starBtn = card.querySelector('.star-btn');
        if (starBtn) {
          starBtn.classList.add('is-starred');
          starBtn.setAttribute('aria-pressed', 'true');
        }
        curStars = Math.max(1, curStars);
      }

      var newScore = calculateScore(curStars, curViews, isFeatured);
      if (newScore !== origScore) {
        hasLocalChanges = true;
      }

      card.setAttribute('data-stars', curStars);
      card.setAttribute('data-views', curViews);
      card.setAttribute('data-copies', curCopies);
      card.setAttribute('data-featured', isFeatured ? 'true' : 'false');
      card.classList.toggle('is-featured', isFeatured);
      card.setAttribute('data-score', newScore);

      var starCountEl = card.querySelector('.star-count');
      var viewCountEl = card.querySelector('.view-count');
      if (starCountEl) starCountEl.textContent = formatCompactNum(curStars);
      if (viewCountEl) viewCountEl.textContent = formatCompactNum(curViews);
    });
    return hasLocalChanges;
  }

  function syncFirestoreLiveMetrics() {
    if (!window.DanicatFirestore) return;
    window.DanicatFirestore.fetchSkillsMap().then(function(bySkill) {
      var gridEl = document.getElementById('skillsGrid');
      if (!gridEl || !bySkill) return;
      var starred = getStarredSkills();

      saveMetricsCache(bySkill);

      gridEl.querySelectorAll('.skill-card').forEach(function(card) {
        var skillId = card.getAttribute('data-skill-id');
        var data = bySkill[skillId];
        if (!data) return;

        var stars = Math.max(0, data.likes || 0);
        if (starred.has(skillId) && stars < 1) {
          stars = 1;
        }
        var views = Math.max(0, data.views || 0);
        var copies = Math.max(0, data.copies || 0);
        var isFeatured = Boolean(data.featured);

        card.setAttribute('data-stars', stars);
        card.setAttribute('data-views', views);
        card.setAttribute('data-copies', copies);
        card.setAttribute('data-featured', isFeatured ? 'true' : 'false');
        card.classList.toggle('is-featured', isFeatured);
        card.setAttribute('data-score', calculateScore(stars, views, isFeatured));

        var starCountEl = card.querySelector('.star-count');
        var viewCountEl = card.querySelector('.view-count');
        if (starCountEl) starCountEl.textContent = formatCompactNum(stars);
        if (viewCountEl) viewCountEl.textContent = formatCompactNum(views);
      });
    }).catch(function(err) {
      console.error('Firestore live metrics sync failed:', err);
    });
  }

  function initFirestoreLiveMetrics() {
    var synced = false;
    var events = ['pointerdown', 'keydown', 'scroll', 'touchstart'];
    function onFirstInteraction() {
      if (synced) return;
      synced = true;
      events.forEach(function(evt) {
        window.removeEventListener(evt, onFirstInteraction, { passive: true });
      });
      syncFirestoreLiveMetrics();
    }
    events.forEach(function(evt) {
      window.addEventListener(evt, onFirstInteraction, { once: true, passive: true });
    });
  }

  (function() {
    var searchInput = document.getElementById('searchInput');
    var pillButtons = document.querySelectorAll('#categoryFilters .pill-btn[data-cat]');
    var sortSelect = document.getElementById('sortSelect');
    var cards = document.querySelectorAll('.skill-card');
    var grid = document.getElementById('skillsGrid');
    var activeCategory = 'all';

    function filterSkills() {
      if (!searchInput || !grid) return;
      var query = searchInput.value.toLowerCase().trim();
      var count = 0;

      cards.forEach(function(card) {
        var cat = card.getAttribute('data-category') || '';
        var name = card.getAttribute('data-name') || '';
        var desc = card.getAttribute('data-desc') || '';
        var tags = card.getAttribute('data-tags') || '';

        var matchesCat = activeCategory === 'all' || cat === activeCategory;
        var matchesQuery = !query || name.includes(query) || desc.includes(query) || cat.includes(query) || tags.includes(query);

        if (matchesCat && matchesQuery) {
          card.style.display = 'flex';
          count++;
        } else {
          card.style.display = 'none';
        }
      });

      var noRes = document.getElementById('noResults');
      if (count === 0) {
        if (!noRes) {
          noRes = document.createElement('div');
          noRes.id = 'noResults';
          noRes.className = 'no-results';
          noRes.textContent = '{{ $t.ui.noResults }}';
          grid.appendChild(noRes);
        }
      } else if (noRes) {
        noRes.remove();
      }
    }

    if (searchInput) {
      searchInput.addEventListener('input', filterSkills);
    }

    if (pillButtons.length > 0) {
      pillButtons.forEach(function(btn) {
        btn.addEventListener('click', function() {
          pillButtons.forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          activeCategory = btn.getAttribute('data-cat') || 'all';
          if (window.history && window.history.replaceState) {
            if (activeCategory === 'all') {
              window.history.replaceState(null, '', window.location.pathname + window.location.search);
            } else {
              window.history.replaceState(null, '', window.location.pathname + window.location.search + '#' + activeCategory);
            }
          }
          filterSkills();
        });
      });

      function handleInitialCategory() {
        var hash = window.location.hash.replace(/^#/, '').toLowerCase().trim();
        var urlParams = new URLSearchParams(window.location.search);
        var catParam = urlParams.get('cat') || hash;
        if (catParam) {
          var targetBtn = document.querySelector('#categoryFilters .pill-btn[data-cat="' + catParam + '"]');
          if (targetBtn) {
            pillButtons.forEach(function(b) { b.classList.remove('active'); });
            targetBtn.classList.add('active');
            activeCategory = catParam;
            filterSkills();
          }
        }
      }
      handleInitialCategory();
      window.addEventListener('hashchange', handleInitialCategory);
    }

    if (sortSelect) {
      sortSelect.value = 'popularity';
      sortSelect.addEventListener('change', function() {
        sortSelect.dataset.userTriggered = 'true';
        sortSkillsGrid(sortSelect.value);
      });
    }

    document.addEventListener('keydown', function(e) {
      if (!searchInput) return;
      if ((e.key === '/' && document.activeElement !== searchInput && !['INPUT', 'TEXTAREA', 'SELECT'].includes((document.activeElement || {}).tagName)) ||
          ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k')) {
        e.preventDefault();
        searchInput.focus();
      }
    });

    if (hydrateCardsFromLocal()) {
      sortSkillsGrid(sortSelect ? sortSelect.value : 'popularity');
    }
    initFirestoreLiveMetrics();

    var savedMode = localStorage.getItem('preferred_cli_mode') || 'kungfu';
    var modeBtn = document.querySelector('.mode-pill[onclick*="' + savedMode + '"]');
    if (modeBtn) {
      setGlobalCliMode(savedMode, modeBtn);
    }
  })();
</script>
