{{- if not (and hugo.IsProduction site.Config.Services.GoogleAnalytics.ID) }}
<script async src="https://www.googletagmanager.com/gtag/js?id=G-8RHDQGEGZ2"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-8RHDQGEGZ2');
</script>
{{- end }}
<meta property="og:image" content="https://danicat.dev/apple-touch-icon.png">
<meta name="twitter:image" content="https://danicat.dev/apple-touch-icon.png">
<meta name="twitter:creator" content="@danicat83">
<link rel="describedby" href="https://skills.danicat.dev/llms.txt">
<link rel="alternate" type="application/json" href="https://skills.danicat.dev/catalog.json" title="Agent Skills">
{{- if and .IsPage (not .Params.isCompanion) }}
<link rel="alternate" type="text/markdown" href="{{ .Params.rawUrl }}" title="{{ .Params.skillName }} (SKILL.md)">
{{- else if and .IsPage .Params.isCompanion }}
<link rel="alternate" type="text/markdown" href="https://skills.danicat.dev/{{ .Params.category }}/{{ .Params.skillFolder }}/{{ .Params.relPath }}" title="{{ .Params.refTitle | default .Title }} (Markdown)">
{{- end }}
{{- if .IsPage }}
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
  const isDark = document.documentElement.classList.contains('dark');
  mermaid.initialize({
    startOnLoad: true,
    theme: isDark ? 'dark' : 'default',
    securityLevel: 'loose'
  });
</script>
{{- end }}
